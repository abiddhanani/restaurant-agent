services:
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - chromadb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # External A2A agents (stub services for Phase 0)
  cuisine-expert:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uv run uvicorn a2a.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    env_file:
      - ../.env
    environment:
      - SERVICE_NAME=cuisine-expert

  dietary-expert:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uv run uvicorn a2a.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8003:8000"
    env_file:
      - ../.env
    environment:
      - SERVICE_NAME=dietary-expert

volumes:
  chroma_data:
