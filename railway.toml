[build]
builder = "dockerfile"
dockerfilePath = "docker/Dockerfile"

[deploy]
startCommand = "uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30

[[services]]
name = "agent"

[services.variables]
PORT = "8000"
ANTHROPIC_MODEL = "claude-sonnet-4-20250514"
